name: Pubblica GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recupera il sito
        uses: actions/checkout@v7

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file statici
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v5
